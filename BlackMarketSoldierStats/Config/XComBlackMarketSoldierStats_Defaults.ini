[BlackMarketSoldierStats.BlackMarketSoldierStats_Defaults]
; MCM Version Control
VERSION_CFG=4

; Highlight above/below average stats
HIGHLIGHT_ABOVE_BELOW_AVERAGE=true

; Stat display mode
STAT_DISPLAY_MODE=0

; Panel location
PANEL_X=-225
PANEL_Y=175

; Reveal cost
REVEAL_COST_ENABLED=false
REVEAL_COST_RESOURCE=Intel
REVEAL_COST_QUANTITY=5

; Require Sectoid autopsy before showing Psi Offense stat
PSI_OFFENSE_REQUIRE_SECTOID_AUTOPSY=true

; Print the ASCII-art banner to the log on startup
LOG_BANNER=true
